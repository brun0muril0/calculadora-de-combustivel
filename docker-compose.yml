version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fuel_calculator_db
    environment:
      POSTGRES_DB: fuel_calculator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fuel_calculator_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fuelcalculator.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: